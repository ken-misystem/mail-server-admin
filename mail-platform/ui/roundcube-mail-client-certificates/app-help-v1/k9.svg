<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 378" role="img" aria-labelledby="title desc"><title id="title">K-9 Mail：受信・送信で証明書を選択</title><desc id="desc">AndroidにP12を取り込む：VPNとアプリ用の証明書として登録、次に、受信サーバ設定 → Client certificate：IMAP 993 / SSL・TLS と本人証明書、次に、送信サーバ設定 → Client certificate：SMTP 587 / STARTTLS と本人証明書</desc><rect width="480" height="100%" rx="18" fill="#eff5fb"/><text x="24" y="36" fill="#18354c" font-size="19" font-family="sans-serif" font-weight="bold">K-9 Mail：受信・送信で証明書を選択</text><rect x="20" y="60" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="86" r="16" fill="#12678b"/><text x="47" y="92" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">1</text><text x="75" y="90" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">AndroidにP12を取り込む</text><text x="38" y="120" fill="#304e63" font-family="sans-serif" font-size="16">VPNとアプリ用の証明書として登録</text><path d="M240 141v14m-5-5 5 5 5-5" fill="none" stroke="#12678b" stroke-width="2"/><rect x="20" y="160" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="186" r="16" fill="#12678b"/><text x="47" y="192" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">2</text><text x="75" y="190" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">受信サーバ設定 → Client certificate</text><text x="38" y="220" fill="#304e63" font-family="sans-serif" font-size="16">IMAP 993 / SSL・TLS と本人証明書</text><path d="M240 241v14m-5-5 5 5 5-5" fill="none" stroke="#12678b" stroke-width="2"/><rect x="20" y="260" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="286" r="16" fill="#12678b"/><text x="47" y="292" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">3</text><text x="75" y="290" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">送信サーバ設定 → Client certificate</text><text x="38" y="320" fill="#304e63" font-family="sans-serif" font-size="16">SMTP 587 / STARTTLS と本人証明書</text></svg>