<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 378" role="img" aria-labelledby="title desc"><title id="title">Roundcubeで用意するもの</title><desc id="desc">パスキーの登録：設定 → パスキーを登録・管理、次に、アプリ用パスワードを発行：メールソフトのパスワード欄で使用、次に、端末証明書を発行・取得：P12と、その保護パスワードを用意</desc><rect width="480" height="100%" rx="18" fill="#eff5fb"/><text x="24" y="36" fill="#18354c" font-size="19" font-family="sans-serif" font-weight="bold">Roundcubeで用意するもの</text><rect x="20" y="60" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="86" r="16" fill="#12678b"/><text x="47" y="92" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">1</text><text x="75" y="90" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">パスキーの登録</text><text x="38" y="120" fill="#304e63" font-family="sans-serif" font-size="16">設定 → パスキーを登録・管理</text><path d="M240 141v14m-5-5 5 5 5-5" fill="none" stroke="#12678b" stroke-width="2"/><rect x="20" y="160" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="186" r="16" fill="#12678b"/><text x="47" y="192" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">2</text><text x="75" y="190" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">アプリ用パスワードを発行</text><text x="38" y="220" fill="#304e63" font-family="sans-serif" font-size="16">メールソフトのパスワード欄で使用</text><path d="M240 241v14m-5-5 5 5 5-5" fill="none" stroke="#12678b" stroke-width="2"/><rect x="20" y="260" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="286" r="16" fill="#12678b"/><text x="47" y="292" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">3</text><text x="75" y="290" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">端末証明書を発行・取得</text><text x="38" y="320" fill="#304e63" font-family="sans-serif" font-size="16">P12と、その保護パスワードを用意</text></svg>