<div id="layout-content" class="selected no-navbar local-auth-gate" role="main">
  <roundcube:object name="logo" src="/images/logo.svg" id="logo" alt="Logo" />
  <div id="local-auth-gate-form" class="propform">
    <p><roundcube:label name="local_auth_gate.emergencydescription" /></p>
    <label for="local-auth-emergency-label"><roundcube:label name="local_auth_gate.emergencylabel" /></label>
    <input id="local-auth-emergency-label" type="text" maxlength="80" autocomplete="off" />
    <button id="local-auth-emergency-enroll" type="button" class="button mainaction">
      <roundcube:label name="local_auth_gate.emergencyenroll" />

    <p><roundcube:button command="logout" type="link" class="button" label="logout" /></p>

  <p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>

<roundcube:include file="includes/footer.html" />
