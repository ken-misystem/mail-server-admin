<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 378" role="img" aria-labelledby="title desc"><title id="title">Mac標準メール：受信と送信に割当て</title><desc id="desc">キーチェーンアクセスにP12を読み込む：ログイン → 自分の証明書で秘密鍵を確認、次に、受信の詳細設定 → TLS証明書：本人の端末証明書を選択、次に、送信の詳細 → TLS証明書：受信と同じ本人の端末証明書を選択</desc><rect width="480" height="100%" rx="18" fill="#eff5fb"/><text x="24" y="36" fill="#18354c" font-size="19" font-family="sans-serif" font-weight="bold">Mac標準メール：受信と送信に割当て</text><rect x="20" y="60" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="86" r="16" fill="#12678b"/><text x="47" y="92" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">1</text><text x="75" y="90" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">キーチェーンアクセスにP12を読み込む</text><text x="38" y="120" fill="#304e63" font-family="sans-serif" font-size="16">ログイン → 自分の証明書で秘密鍵を確認</text><path d="M240 141v14m-5-5 5 5 5-5" fill="none" stroke="#12678b" stroke-width="2"/><rect x="20" y="160" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="186" r="16" fill="#12678b"/><text x="47" y="192" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">2</text><text x="75" y="190" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">受信の詳細設定 → TLS証明書</text><text x="38" y="220" fill="#304e63" font-family="sans-serif" font-size="16">本人の端末証明書を選択</text><path d="M240 241v14m-5-5 5 5 5-5" fill="none" stroke="#12678b" stroke-width="2"/><rect x="20" y="260" width="440" height="78" rx="12" fill="#fff" stroke="#b5ccdd"/><circle cx="47" cy="286" r="16" fill="#12678b"/><text x="47" y="292" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17">3</text><text x="75" y="290" fill="#18354c" font-family="sans-serif" font-size="18" font-weight="bold">送信の詳細 → TLS証明書</text><text x="38" y="320" fill="#304e63" font-family="sans-serif" font-size="16">受信と同じ本人の端末証明書を選択</text></svg>