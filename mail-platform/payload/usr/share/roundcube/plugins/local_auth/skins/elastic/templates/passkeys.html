<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />
<roundcube:include file="includes/settings-menu.html" />
<h1 class="voice"><roundcube:label name="local_auth.passkeys" /></h1>
<div id="layout-content" class="selected local-auth-management" role="main">
  <div class="header">
    <a class="button icon back-sidebar-button" href="#sidebar"><span class="inner"><roundcube:label name="settings" /></span></a>
    <span class="header-title"><roundcube:label name="local_auth.passkeys" /></span>
  </div>
  <div class="boxcontent content">
    <div class="local-auth-panel">
<p class="ui-feedback-result" role="note">パスキーで本人確認後は同じログインで最長15分間、本人管理の追加認証を共有します。ログアウト・認証設定変更・パスキー無効化後は再確認します。Recovery Codeによる既存の確認は15分共有の対象ではありません。</p>
      <div id="local-auth-result" class="ui-feedback-result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></div>
      <p id="local-auth-prerequisite-note" role="status" aria-live="polite"><roundcube:label name="local_auth.prerequisiteloading" /></p>
      <fieldset class="local-auth-section">
        <legend><roundcube:label name="local_auth.registeredpasskeys" /></legend>
        <div class="local-auth-section-body">
          <p id="local-auth-count" aria-live="polite"><roundcube:label name="local_auth.credentiallistloading" /></p>
          <button id="local-auth-refresh" type="button" class="button"><roundcube:label name="local_auth.refreshcredentials" /></button>
          <p class="local-auth-help"><roundcube:label name="local_auth.ownerremovehelp" /></p>
          <div id="local-auth-credentials" class="local-auth-credentials" aria-live="polite"></div>
        </div>
      </fieldset>
      <fieldset class="local-auth-section">
        <legend><roundcube:label name="local_auth.registerpasskey" /></legend>
        <div class="local-auth-section-body">
          <label class="local-auth-label" for="local-auth-label"><roundcube:label name="local_auth.passkeylabel" /></label>
          <div class="local-auth-form-row">
            <input id="local-auth-label" name="passkey_device_label" type="text" required maxlength="100" autocomplete="off" />
            <button id="local-auth-register" type="button" class="button mainaction">
              <roundcube:label name="local_auth.registerpasskey" />
            </button>
            <button id="local-auth-cancel" type="button" class="button" hidden disabled><roundcube:label name="local_auth.cancelregistration" /></button>
          </div>
        </div>
      </fieldset>
      <fieldset class="local-auth-section">
        <legend><roundcube:label name="local_auth.recoverycodes" /></legend>
        <div class="local-auth-section-body">
          <p class="local-auth-help"><roundcube:label name="local_auth.recoverycodedescription" /></p>
          <p class="local-auth-help"><roundcube:label name="local_auth.ownerrecoverypolicy" /></p>
          <button id="local-auth-recovery-replace" type="button" disabled class="button">
            <roundcube:label name="local_auth.replacerecoverycodes" />
          </button>
          <pre id="local-auth-recovery-codes" hidden aria-live="polite"></pre>
        </div>
      </fieldset>

      <fieldset class="local-auth-section">
        <legend><roundcube:label name="local_auth.ownerpolicytitle" /></legend>
        <p id="local-auth-policy-state" role="status"><roundcube:label name="local_auth.ownerpolicyloading" /></p>
        <p class="local-auth-help"><roundcube:label name="local_auth.ownerpolicyhelp" /></p>
        <button id="local-auth-policy-enable" type="button" class="button" disabled><roundcube:label name="local_auth.ownerpolicyenable" /></button>
        <button id="local-auth-policy-disable" type="button" class="button" disabled><roundcube:label name="local_auth.ownerpolicydisable" /></button>
      </fieldset>
      <dialog id="local-auth-proof-dialog" aria-labelledby="local-auth-proof-title">
        <h2 id="local-auth-proof-title"><roundcube:label name="local_auth.actionverify" /></h2>
        <button id="local-auth-proof-passkey" type="button" class="button"><roundcube:label name="local_auth.ownerproofpasskey" /></button>
        <label for="local-auth-proof-code"><roundcube:label name="local_auth.ownerproofcode" /></label>
        <input id="local-auth-proof-code" name="owner_recovery_code" type="password" autocomplete="off" maxlength="120" spellcheck="false" aria-describedby="local-auth-recovery-input-help" />
        <p id="local-auth-recovery-input-help"><roundcube:label name="local_auth.recoveryinputhelp" /></p>
        <button id="local-auth-proof-recovery" type="button" class="button"><roundcube:label name="local_auth.ownerproofrecovery" /></button>
        <button id="local-auth-proof-cancel" type="button" class="button"><roundcube:label name="local_auth.ownerproofcancel" /></button>
      </dialog>
    </div>
  </div>
</div>
<roundcube:include file="includes/footer.html" />
